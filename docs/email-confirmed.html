<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Confirmed — MySalapi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #2E9688 0%, #23786d 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    margin-bottom: 20px;
  }
  .check {
    width: 64px;
    height: 64px;
    background: #2E9688;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px auto;
  }
  .check svg { width: 32px; height: 32px; }
  h1 {
    font-size: 22px;
    color: #1a1a1a;
    margin-bottom: 10px;
    font-weight: 800;
  }
  p {
    font-size: 14px;
    color: #666666;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .brand {
    font-size: 12px;
    color: #aaaaaa;
    margin-top: 24px;
  }
  .hint {
    background: #f2f4f3;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: #555555;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Email Confirmed!</h1>
    <p>Your MySalapi account is now active. You can close this page and head back to the app to log in.</p>
    <div class="hint">
      Open the <strong>MySalapi</strong> app on your phone and log in with your email and password.
    </div>
  </div>
</body>
</html>
